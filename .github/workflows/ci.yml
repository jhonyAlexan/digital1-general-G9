name: CI repo general
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install pyyaml
      - name: Mapa de memoria coherente y generados al día
        run: python3 tools/gen_memmap.py --check
      - name: Validar y simular todos los cores
        run: python3 tools/validate_core.py --all --require-sim
      - name: Sintaxis de scripts Python
        run: python3 -m py_compile soc/wb_peripheral.py soc/build.py tools/*.py
      - name: Driver de referencia compila (sintaxis C)
        run: gcc -fsyntax-only -Ifirmware/include -Itemplate/cores/blink/firmware template/cores/blink/firmware/blink.c
  soc:
    # Construcción del SoC en simulación/síntesis: activar cuando se defina la placa del curso.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "PENDIENTE - instalar LiteX y toolchain, y ejecutar soc/build.py --board <placa> --build"
