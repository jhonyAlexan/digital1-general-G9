# Recibe un periférico validado de un equipo y abre un PR de integración en el repo general.
# Se dispara con  repository_dispatch (desde solicitar-integracion.yml del equipo)
# o manualmente. Requiere el secret TEAMS_TOKEN (lectura de los repos de equipo).
name: Integrar equipo
on:
  repository_dispatch:
    types: [equipo-validado]
  workflow_dispatch:
    inputs:
      repo:  {description: "ORG/repo-del-equipo", required: true}
      core:  {description: "Periférico (carpeta en cores/)", required: true}
      ref:   {description: "Etiqueta o rama del equipo", required: true}
jobs:
  integrar:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      CORE: ${{ github.event.client_payload.core || inputs.core }}
      REF:  ${{ github.event.client_payload.ref  || inputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.REF }}
          token: ${{ secrets.TEAMS_TOKEN }}
          path: equipo
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install pyyaml -q
      - name: Identificar equipo en teams.yml
        id: t
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, yaml, sys
          eq = yaml.safe_load(open("teams.yml"))["equipos"] or []
          t = next((e for e in eq if e["repo"] == os.environ["REPO"]), None)
          if not t: sys.exit(f"repo {os.environ['REPO']} no está en teams.yml")
          print("team=" + t["name"])
          PY
      - name: Validar e importar el core
        run: python3 tools/integrate_core.py --team-dir equipo --core "$CORE" --team "${{ steps.t.outputs.team }}"
      - name: Verificar mapa de memoria y todos los cores
        run: |
          python3 tools/gen_memmap.py --check
          python3 tools/validate_core.py --all --require-sim
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: integracion/${{ steps.t.outputs.team }}/${{ env.CORE }}
          title: "Integrar ${{ env.CORE }} (${{ steps.t.outputs.team }}, ${{ env.REF }})"
          commit-message: "Integrar ${{ env.CORE }} desde ${{ env.REPO }}@${{ env.REF }}"
          body: |
            Periférico **${{ env.CORE }}** validado por **${{ steps.t.outputs.team }}**
            (`${{ env.REPO }}` @ `${{ env.REF }}`). Estructura y simulación pasaron en CI.

            Lista para el revisor:
            - [ ] Registros y offsets coinciden con `interfaces/memory_map.yml`
            - [ ] Diagramas y driver C revisados
            - [ ] (opcional) Construcción del SoC con `soc/build.py` en la placa del curso
          labels: integracion
