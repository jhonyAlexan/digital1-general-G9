# Distribuye las actualizaciones comunes a los repos de equipo (un PR por equipo).
# Requiere el secret TEAMS_TOKEN: PAT (o GitHub App) con permisos contents, pull-requests
# y **workflow** en los repos de los equipos (el sync actualiza .github/workflows).
name: Sincronizar equipos
on:
  push:
    branches: [main]
    paths: ["soc/**", "interfaces/**", "tools/**", "docs/**", "template/**", "cores/**",
            "firmware/include/**", "teams.yml"]
  workflow_dispatch:
jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          pip install pyyaml -q
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          eq = yaml.safe_load(open("teams.yml"))["equipos"] or []
          print("matrix=" + json.dumps({"include": [{"name": e["name"], "repo": e["repo"]} for e in eq]}))
          PY
  sync:
    needs: lista
    if: ${{ toJson(fromJson(needs.lista.outputs.matrix).include) != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.lista.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.TEAMS_TOKEN }}
          path: equipo
      - run: pip install pyyaml -q
      - run: python3 tools/sync_to_team.py --team "${{ matrix.name }}" --dest equipo
      - uses: peter-evans/create-pull-request@v6
        with:
          path: equipo
          token: ${{ secrets.TEAMS_TOKEN }}
          branch: upstream/actualizacion-comun
          commit-message: "Actualización del repositorio general (${{ github.sha }})"
          title: "Actualización del repositorio general"
          body: |
            Cambios comunes provenientes del repositorio general
            (commit `${{ github.sha }}`): SoC, mapa de memoria, herramientas, plantillas y cores integrados.

            Revise y fusione. **No edite** los archivos gestionados (ver README): se sobrescriben.
