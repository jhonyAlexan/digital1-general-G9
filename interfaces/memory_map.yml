# ============================================================================
#  MAPA DE MEMORIA Y PERIFÉRICOS  —  FUENTE ÚNICA DE VERDAD
# ----------------------------------------------------------------------------
#  De este archivo se generan:
#    - firmware/include/memory_map.h   (constantes para los drivers C)
#    - docs/mapa_memoria.md            (tabla legible)
#  y lo lee soc/build.py para construir el SoC LiteX.
#
#  Regenerar:  python3 tools/gen_memmap.py
#  Verificar:  python3 tools/gen_memmap.py --check
#
#  Solo el profesor / integrador modifica este archivo (vía PR al repo general).
# ============================================================================
version: 1

# Regiones estándar del SoC. LiteX asigna los orígenes por defecto; se
# documentan aquí para que firmware y documentación coincidan.
regions:
  rom:      {origin: 0x00000000, size: 0x00010000, desc: "ROM integrada (BIOS/firmware)"}
  sram:     {origin: 0x10000000, size: 0x00002000, desc: "SRAM integrada"}
  main_ram: {origin: 0x40000000, size: 0x00800000, desc: "RAM principal (depende de la placa)"}
  csr:      {origin: 0xF0000000, size: 0x00010000, desc: "Bus CSR de LiteX (UART, timer, ctrl...)"}

# Ventana reservada para los periféricos del curso (bus Wishbone, 32 bits).
periph_window: {origin: 0x00500000, size: 0x00100000}

# Cada periférico ocupa una ventana alineada a su tamaño (potencia de 2).
# 'addr_width' = bits del puerto `addr` del RTL (offset local en bytes).
peripherals:
  - name: blink
    core: blink              # directorio en cores/ (o template/cores/)
    module: perip_blink      # módulo Verilog top del periférico
    base: 0x00500000
    size: 0x00001000
    addr_width: 4
    owner: referencia        # equipo responsable (o 'referencia')
    registers:
      - {offset: 0x00, name: CONTROL, access: RW, desc: "Bit 0: habilita el parpadeo"}
      - {offset: 0x04, name: PERIOD,  access: RW, desc: "Ciclos de reloj por cada cambio del LED"}
    ports:                   # señales extra del módulo, más allá del bus estándar
      - {name: led, dir: out, width: 1, connect: "user_led:0"}   # <recurso>:<índice> de la placa

  # ---- Plantilla para nuevos periféricos (descomentar y asignar) -----------
  # - name: <nombre>
  #   core: <nombre>
  #   module: perip_<nombre>
  #   base: 0x00501000       # siguiente ventana libre, alineada a 'size'
  #   size: 0x00001000
  #   addr_width: 5
  #   owner: equipo-XX
  #   registers:
  #     - {offset: 0x00, name: CONTROL, access: RW, desc: "..."}
  #   ports:
  #     - {name: <pin>, dir: out, width: 1, connect: "<recurso>:<índice>"}
