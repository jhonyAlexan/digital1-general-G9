name: CI equipo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install pyyaml
      - name: Mapa de memoria al día
        run: python3 tools/gen_memmap.py --check
      - name: Validar y simular cores
        run: python3 tools/validate_core.py --all --require-sim
