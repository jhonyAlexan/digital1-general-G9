# Al crear una etiqueta  validado/<periferico>/vN  se solicita la integración al repo general.
# Requiere el secret GENERAL_REPO_TOKEN (PAT con permiso de escribir 'contents' en el repo general)
# y la variable de repositorio GENERAL_REPO = ORG/repo-general.
name: Solicitar integración
on:
  push:
    tags: ["validado/*/*"]
jobs:
  solicitar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install pyyaml
      - name: Extraer periférico
        id: t
        run: |
          IFS=/ read -r _ core ver <<< "${GITHUB_REF_NAME}"
          echo "core=$core" >> "$GITHUB_OUTPUT"
      - name: Validar el core etiquetado
        run: python3 tools/validate_core.py "cores/${{ steps.t.outputs.core }}" --registered --require-sim
      - name: Notificar al repo general
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GENERAL_REPO_TOKEN }}
          repository: ${{ vars.GENERAL_REPO }}
          event-type: equipo-validado
          client-payload: >-
            {"repo": "${{ github.repository }}",
             "core": "${{ steps.t.outputs.core }}",
             "ref": "${{ github.ref_name }}"}
